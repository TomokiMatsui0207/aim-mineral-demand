name: Public code checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo.py
      - run: python scripts/plot_results.py --input output/demo/synthetic_results.csv --grid-case SYNTHETIC --case SYNTHETIC --model-version SYNTHETIC --out figures/demo
